<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A-Frame Space Planets</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- 로컬 더블클릭 실행 시에도 CORS 차단 없이 로드되는 3D 모델 데이터 -->
    <script src="model_data.js"></script>
    <script>
      AFRAME.registerComponent("starfield", {
        init: function () {
          var group = document.createElement("a-entity");
          for (var i = 0; i < 500; i += 1) {
            var star = document.createElement("a-sphere");
            var radius = 70;
            var phi = Math.random() * Math.PI * 2;
            var costheta = Math.random() * 2 - 1;
            var theta = Math.acos(costheta);
            var x = radius * Math.sin(theta) * Math.cos(phi);
            var y = radius * Math.sin(theta) * Math.sin(phi);
            var z = radius * Math.cos(theta);

            star.setAttribute("position", x + " " + y + " " + z);
            star.setAttribute("radius", 0.06 + Math.random() * 0.06);
            star.setAttribute("color", "#ffffff");
            star.setAttribute("material", "shader: flat; emissive: #ffffff; emissiveIntensity: 1;");
            group.appendChild(star);
          }
          this.el.appendChild(group);
        },
      });

      // 브라우저 보안(CORS) 제한 없이 메모리에서 바로 GLB 모델을 파싱하는 컴포넌트
      AFRAME.registerComponent("inline-model", {
        init: function () {
          var el = this.el;
          if (!window.MODEL_BASE64) {
            console.error("model_data.js 파일이 로드되지 않았습니다.");
            return;
          }
          var binaryString = atob(window.MODEL_BASE64);
          var len = binaryString.length;
          var bytes = new Uint8Array(len);
          for (var i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }
          var LoaderClass = (AFRAME.THREE && AFRAME.THREE.GLTFLoader) || THREE.GLTFLoader;
          var loader = new LoaderClass();
          loader.parse(
            bytes.buffer,
            "",
            function (gltf) {
              el.setObject3D("mesh", gltf.scene || gltf.scenes[0]);
            },
            function (err) {
              console.error("GLB 모델 파싱 에러:", err);
            }
          );
        },
      });

      // 3D 입체 하트 도형 컴포넌트
      AFRAME.registerComponent("heart-model", {
        init: function () {
          var el = this.el;
          var heartShape = new THREE.Shape();
          heartShape.moveTo(0, 0.25);
          heartShape.bezierCurveTo(0, 0.45, -0.3, 0.7, -0.6, 0.7);
          heartShape.bezierCurveTo(-0.9, 0.7, -0.9, 0.3, -0.9, 0.3);
          heartShape.bezierCurveTo(-0.9, -0.05, -0.5, -0.4, 0, -0.8);
          heartShape.bezierCurveTo(0.5, -0.4, 0.9, -0.05, 0.9, 0.3);
          heartShape.bezierCurveTo(0.9, 0.3, 0.9, 0.7, 0.6, 0.7);
          heartShape.bezierCurveTo(0.3, 0.7, 0, 0.45, 0, 0.25);

          var extrudeSettings = {
            depth: 0.35,
            bevelEnabled: true,
            bevelSegments: 4,
            steps: 1,
            bevelSize: 0.08,
            bevelThickness: 0.08,
          };

          var geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
          geometry.center();

          var material = new THREE.MeshStandardMaterial({
            color: new THREE.Color("#ff2a6d"),
            metalness: 0.3,
            roughness: 0.4,
            emissive: new THREE.Color("#ff2a6d"),
            emissiveIntensity: 0.3,
          });

          var mesh = new THREE.Mesh(geometry, material);
          el.setObject3D("mesh", mesh);
        },
      });

      // 3D 귀여운 강아지 모형 컴포넌트
      AFRAME.registerComponent("dog-model", {
        init: function () {
          var group = new THREE.Group();

          // 털 재질 (황금빛 베이지)
          var furMat = new THREE.MeshStandardMaterial({
            color: 0xe5a663,
            roughness: 0.7,
            metalness: 0.1,
          });
          // 귀와 꼬리용 짙은 갈색 재질
          var darkFurMat = new THREE.MeshStandardMaterial({
            color: 0x8a4b24,
            roughness: 0.7,
            metalness: 0.1,
          });
          // 흰색 주둥이 재질
          var snoutMat = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.6,
          });
          // 눈과 코용 검은 재질
          var blackMat = new THREE.MeshStandardMaterial({
            color: 0x111111,
            roughness: 0.3,
          });

          // 1. 몸통 (Body)
          var bodyGeo = new THREE.SphereGeometry(0.48, 16, 16);
          bodyGeo.scale(1.35, 0.9, 0.9);
          var body = new THREE.Mesh(bodyGeo, furMat);
          group.add(body);

          // 2. 머리 (Head)
          var headGeo = new THREE.SphereGeometry(0.38, 16, 16);
          var head = new THREE.Mesh(headGeo, furMat);
          head.position.set(0.48, 0.35, 0);
          group.add(head);

          // 주둥이 (Snout)
          var snoutGeo = new THREE.SphereGeometry(0.19, 14, 14);
          snoutGeo.scale(1.2, 0.8, 0.9);
          var snout = new THREE.Mesh(snoutGeo, snoutMat);
          snout.position.set(0.76, 0.28, 0);
          group.add(snout);

          // 코 (Nose)
          var noseGeo = new THREE.SphereGeometry(0.065, 10, 10);
          var nose = new THREE.Mesh(noseGeo, blackMat);
          nose.position.set(0.94, 0.35, 0);
          group.add(nose);

          // 눈 (Eyes: 좌/우)
          var eyeGeo = new THREE.SphereGeometry(0.05, 10, 10);
          var eyeL = new THREE.Mesh(eyeGeo, blackMat);
          eyeL.position.set(0.72, 0.46, 0.17);
          var eyeR = new THREE.Mesh(eyeGeo, blackMat);
          eyeR.position.set(0.72, 0.46, -0.17);
          group.add(eyeL);
          group.add(eyeR);

          // 귀 (Floppy Ears: 좌/우)
          var earGeo = new THREE.CylinderGeometry(0.08, 0.04, 0.38, 10);
          earGeo.rotateZ(0.3);
          earGeo.rotateX(0.4);
          var earL = new THREE.Mesh(earGeo, darkFurMat);
          earL.position.set(0.45, 0.5, 0.34);

          var earGeoR = new THREE.CylinderGeometry(0.08, 0.04, 0.38, 10);
          earGeoR.rotateZ(0.3);
          earGeoR.rotateX(-0.4);
          var earR = new THREE.Mesh(earGeoR, darkFurMat);
          earR.position.set(0.45, 0.5, -0.34);
          group.add(earL);
          group.add(earR);

          // 3. 다리 4개 (Legs)
          var legGeo = new THREE.CylinderGeometry(0.09, 0.08, 0.4, 10);
          var legFL = new THREE.Mesh(legGeo, furMat);
          legFL.position.set(0.35, -0.36, 0.24);
          var legFR = new THREE.Mesh(legGeo, furMat);
          legFR.position.set(0.35, -0.36, -0.24);
          var legBL = new THREE.Mesh(legGeo, furMat);
          legBL.position.set(-0.35, -0.36, 0.24);
          var legBR = new THREE.Mesh(legGeo, furMat);
          legBR.position.set(-0.35, -0.36, -0.24);
          group.add(legFL);
          group.add(legFR);
          group.add(legBL);
          group.add(legBR);

          // 4. 꼬리 (Tail)
          var tailGeo = new THREE.CylinderGeometry(0.04, 0.065, 0.35, 8);
          tailGeo.rotateZ(-0.75);
          var tail = new THREE.Mesh(tailGeo, darkFurMat);
          tail.position.set(-0.68, 0.24, 0);
          group.add(tail);

          this.el.setObject3D("mesh", group);
        },
      });
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020617;
      }
    </style>
  </head>
  <body>
    <a-scene background="color: #020617">
      <a-entity starfield></a-entity>

      <a-entity light="type: ambient; color: #8892b0; intensity: 1.2"></a-entity>
      <a-entity
        light="type: point; color: #ffffff; intensity: 1.5; distance: 90"
        position="0 6 6"
      ></a-entity>
      <a-entity
        light="type: directional; color: #ffffff; intensity: 1.0"
        position="5 10 7"
      ></a-entity>

      <a-entity id="camera-rig" position="0 1.6 0">
        <a-camera position="0 0 0"></a-camera>

        <a-entity
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4500; easing: linear;"
        >
          <a-sphere
            position="2.8 0.2 0"
            radius="0.25"
            color="#fcfc05"
            material="metalness: 0.15; roughness: 0.65;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 2200; easing: linear;"
          ></a-sphere>
        </a-entity>

        <a-entity
          rotation="14 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear;"
        >
          <a-sphere
            position="4.2 -0.1 0"
            radius="0.7"
            color="#30cbff"
            material="metalness: 0.2; roughness: 0.55;"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear;"
          ></a-sphere>
        </a-entity>

        <a-entity
          rotation="-10 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10200; easing: linear;"
        >
          <a-entity
            inline-model
            position="5.6 0.35 0"
            scale="9 9 9"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 3800; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 빠른 속도로 공전하는 3D 하트 도형 -->
        <a-entity
          rotation="20 0 -10"
          animation="property: rotation; to: 20 360 -10; loop: true; dur: 2600; easing: linear;"
        >
          <a-entity
            heart-model
            position="7.2 0.4 0"
            scale="1.5 1.5 1.5"
            animation="property: rotation; to: 360 360 0; loop: true; dur: 1800; easing: linear;"
          ></a-entity>
        </a-entity>

        <!-- 원들과 비슷한 크기로 느긋하게 공전하는 3D 강아지 모형 -->
        <a-entity
          rotation="-15 0 25"
          animation="property: rotation; to: -15 360 25; loop: true; dur: 18000; easing: linear;"
        >
          <a-entity
            dog-model
            position="8.8 -0.2 0"
            scale="1 1 1"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear;"
          ></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
